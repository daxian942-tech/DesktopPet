<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>独立动物模型预览</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#e9e5de}
    #wrap{width:100vw;height:100vh;display:grid;place-items:center}
    #pet{width:720px;height:720px;display:block}
  </style>
</head>
<body>
  <div id="wrap"><canvas id="pet"></canvas></div>
  <script src="./model-preview.js"></script>
  <script>
    // Optional ?pet=<key>&t=<seconds> makes headless screenshots deterministic.
    (function () {
      var qs = new URLSearchParams(location.search);
      var pet = qs.get('pet');
      var t = qs.get('t');
      var mood = qs.get('mood');
      var typing = qs.get('typing');
      // ?reach=<0..1>：直接固定「手伸到键盘」的进度，用于确定性截图。
      // 无头 Chrome 的虚拟时间不推进真实 elapsed，暂停/收回这类基于时间的
      // 状态机没法静态验证，所以用固定进度展示伸缩的三个关键帧。
      var reach = qs.get('reach');
      // ?jump=<charge|air|land>&jumpAmt=<0..1> 定格跳跃三态用于截图验收
      var jump = qs.get('jump');
      var jumpAmt = qs.get('jumpAmt');
      if (!pet) return;
      function ready() {
        if (typeof window.showPet !== 'function') { setTimeout(ready, 40); return; }
        window.showPet(pet);
        // reach / jump 也要能单独生效，否则只传其中一个时会被提前 return 掉。
        if (t === null && !mood && !typing && reach === null && !jump) return;
        function seek() {
          if (!window.petEngine) { setTimeout(seek, 40); return; }
          if (t !== null) window.petEngine.elapsed = parseFloat(t);
          window.petEngine.lastFrameMs = performance.now();
          if (mood) window.petEngine.triggerCareMood(mood, 60);
          if (typing) {
            window.petEngine.paws.L.down = typing === 'right' ? false : true;
            window.petEngine.paws.R.down = typing === 'left' ? false : true;
          }
          if (reach !== null && window.petEngine.speciesModels) {
            window.petEngine.speciesModels.previewHandReach = parseFloat(reach);
          }
          if (jump) window.petEngine.previewJump(jump, jumpAmt === null ? 1 : parseFloat(jumpAmt));
          // 带 t 或 jump 参数 = 确定性截图：渲染一两帧到目标时刻后立即冻结画面
          if (t !== null || jump) {
            requestAnimationFrame(function () {
              requestAnimationFrame(function () { window.petEngine.stop(); });
            });
          }
        }
        seek();
      }
      ready();
    })();
  </script>
</body>
</html>
